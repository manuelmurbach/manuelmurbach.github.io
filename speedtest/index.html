<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speed Test</title>
<meta name="description" content="Internet speed test without ads: ping, download and upload.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/speedtest.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speed Test">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100e17" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f3ee;
    --fg: #17151f;
    --muted: #6b6676;
    --tile-bg: rgba(255, 255, 255, 0.6);
    --tile-border: rgba(23, 21, 31, 0.08);
    --accent: #0F6E56;
    --accent-soft: #E1F5EE;
    --series-up: #2a78d6;
    --bad: #d6453a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100e17;
      --fg: #f3f1f8;
      --muted: #a49fb3;
      --tile-bg: rgba(255, 255, 255, 0.05);
      --tile-border: rgba(255, 255, 255, 0.09);
      --accent: #5DCAA5;
      --accent-soft: #04342C;
      --series-up: #3987e5;
      --bad: #ff7b6e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: max(env(safe-area-inset-top), 1rem) 1rem max(env(safe-area-inset-bottom), 1rem);
  }
  .top, main { max-width: 520px; width: 100%; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .back { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 0.4rem 0; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.5rem; }
  .live { text-align: center; }
  .live-label { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); min-height: 1.2em; }
  .live-value {
    font-size: clamp(5.5rem, 30vw, 9.5rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .live-unit { font-size: 1.1rem; font-weight: 700; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--tile-border); overflow: hidden; margin-top: 1rem; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s linear; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .stat { background: var(--tile-bg); border: 1px solid var(--tile-border); border-radius: 16px; padding: 0.75rem 0.85rem; }
  .stat.active { border-color: var(--accent); }
  .stat-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .stat-value { margin-top: 0.15rem; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat-value small { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-left: 0.15rem; }
  .stat-sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.1rem; min-height: 1em; }
  .spark { display: block; width: 100%; height: 20px; margin-top: 0.35rem; overflow: visible; }
  .spark-line { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .spark-area { fill: var(--muted); fill-opacity: 0.12; stroke: none; }

  .start {
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    padding: 0.95rem;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .start { color: #04342C; } }
  .start:disabled { opacity: 0.5; cursor: default; }
  .message { font-size: 0.85rem; color: var(--muted); text-align: center; min-height: 1.2em; }
  .message.error { color: var(--bad); }

  .graph-card {
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 16px;
    padding: 0.85rem 0.9rem 0.6rem;
  }
  .graph-legend {
    display: flex;
    gap: 1rem;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  .graph-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .graph-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .graph-legend .dot-down { background: var(--accent); }
  .graph-legend .dot-up { background: var(--series-up); }
  #graph-svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
  #graph-svg text { font-family: inherit; fill: var(--muted); }
  .series-down-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series-down-area { fill: var(--accent); fill-opacity: 0.1; stroke: none; }
  .series-up-line { fill: none; stroke: var(--series-up); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .series-up-area { fill: var(--series-up); fill-opacity: 0.1; stroke: none; }
  .end-dot { stroke: var(--tile-bg); stroke-width: 2; opacity: 0; transition: opacity 0.15s; }
  .end-label { font-weight: 700; opacity: 0; transition: opacity 0.15s; }
  .grid-line { stroke: var(--tile-border); stroke-width: 1; }
  .hover-line { stroke: var(--muted); stroke-width: 1; opacity: 0; }
  .hover-dot { stroke: var(--tile-bg); stroke-width: 2; opacity: 0; }
  .hover-label { font-weight: 700; fill: var(--fg); opacity: 0; }

  .history h2 { margin: 0 0 0.4rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .history ol { list-style: none; margin: 0; padding: 0; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .history li { display: grid; grid-template-columns: 1.4fr 1fr 1fr 0.8fr; gap: 0.4rem; padding: 0.35rem 0; border-top: 1px solid var(--tile-border); color: var(--muted); }
  .history li b { color: var(--fg); font-weight: 700; }
  .note { font-size: 0.7rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← Apps</a>
  </div>

  <main>
    <div class="live">
      <div class="live-label" id="phase">Ready</div>
      <div class="live-value" id="live">–</div>
      <div class="live-unit" id="live-unit">Mbit/s</div>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
    </div>

    <section class="graph-card" id="graph-card" hidden>
      <div class="graph-legend">
        <span><i class="dot-down"></i>Download</span>
        <span><i class="dot-up"></i>Upload</span>
      </div>
      <svg id="graph-svg" viewBox="0 0 500 110" role="img" aria-label="Speed over the course of the test">
        <line class="grid-line" id="grid-max-line" x1="0" y1="18" x2="500" y2="18" />
        <text id="grid-max-label" x="498" y="14" text-anchor="end" font-size="9"></text>
        <line class="grid-line" x1="0" y1="96" x2="500" y2="96" />
        <path class="series-down-area" id="area-down" d="" />
        <path class="series-up-area" id="area-up" d="" />
        <path class="series-down-line" id="line-down" d="" />
        <path class="series-up-line" id="line-up" d="" />
        <circle class="end-dot" id="end-down" r="4" fill="var(--accent)" />
        <circle class="end-dot" id="end-up" r="4" fill="var(--series-up)" />
        <text class="end-label" id="end-down-label" font-size="9" fill="var(--accent)"></text>
        <text class="end-label" id="end-up-label" font-size="9" fill="var(--series-up)"></text>
        <line class="hover-line" id="hover-line" y1="18" y2="96" />
        <circle class="hover-dot" id="hover-dot" r="4" />
        <text class="hover-label" id="hover-label" font-size="9" text-anchor="middle"></text>
      </svg>
    </section>

    <div class="stats">
      <div class="stat" id="card-ping">
        <div class="stat-label">Ping</div>
        <div class="stat-value" id="ping">–</div>
        <svg id="ping-spark" class="spark" viewBox="0 0 100 24" aria-hidden="true">
          <path id="ping-spark-area" class="spark-area" d="" />
          <path id="ping-spark-line" class="spark-line" d="" />
        </svg>
        <div class="stat-sub" id="jitter"></div>
      </div>
      <div class="stat" id="card-down">
        <div class="stat-label">Avg download</div>
        <div class="stat-value" id="down">–</div>
        <div class="stat-sub" id="down-sub">Mbit/s</div>
      </div>
      <div class="stat" id="card-up">
        <div class="stat-label">Avg upload</div>
        <div class="stat-value" id="up">–</div>
        <div class="stat-sub" id="up-sub">Mbit/s</div>
      </div>
    </div>

    <button class="start" id="start" type="button">Start test</button>
    <div class="message" id="message"></div>

    <section class="history" id="history" hidden>
      <h2>Recent tests</h2>
      <ol id="history-list"></ol>
    </section>

    <div class="note">Measured against Cloudflare's speed test servers. A test takes about 10 seconds and usually uses less than 30 MB of data.</div>
  </main>

<script>
  const BASE = 'https://speed.cloudflare.com';
  const PING_COUNT = 15;
  const STREAMS = 3;                 // parallel connections, so fast lines can be saturated
  const DOWN_SECONDS = 4, UP_SECONDS = 4;  // short test: enough for a good estimate
  const DOWN_CAP = 20e6, UP_CAP = 8e6;     // bytes, keeps mobile data use small
  const DOWN_CHUNK = 5e6, UP_CHUNK = 1e6;
  const WARMUP_MS = 700;             // ignore the start (TCP slow start)

  const $ = id => document.getElementById(id);
  const fmt = mbps => mbps >= 100 ? Math.round(mbps).toString() : mbps.toFixed(1);

  function setPhase(name, card) {
    $('phase').textContent = name;
    for (const id of ['card-ping', 'card-down', 'card-up']) $(id).classList.toggle('active', id === card);
  }
  function setLive(value, unit, progress) {
    $('live').textContent = value;
    $('live-unit').textContent = unit;
    $('bar').style.width = `${Math.min(100, progress * 100)}%`;
  }

  // Tiny trend line on the Ping card itself (own ms scale, so it stays off
  // the Mbit/s chart rather than sharing an axis with it).
  function drawPingSpark(times) {
    const W = 100, H = 24, PAD = 2;
    if (!times.length) {
      $('ping-spark-line').setAttribute('d', '');
      $('ping-spark-area').setAttribute('d', '');
      return;
    }
    const min = Math.min(...times), max = Math.max(...times);
    const range = Math.max(1, max - min);
    const x = i => PAD + (i / Math.max(1, times.length - 1)) * (W - PAD * 2);
    const y = v => PAD + (H - PAD * 2) - ((v - min) / range) * (H - PAD * 2);
    const line = times.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const base = H - PAD;
    $('ping-spark-line').setAttribute('d', line);
    $('ping-spark-area').setAttribute('d', `${line} L${x(times.length - 1).toFixed(1)},${base} L${x(0).toFixed(1)},${base} Z`);
  }

  // ---- Ping: time tiny requests; median is the ping, mean step-to-step change the jitter.
  async function measurePing() {
    const times = [];
    drawPingSpark(times);
    for (let i = 0; i < PING_COUNT; i++) {
      const t0 = performance.now();
      const res = await fetch(`${BASE}/__down?bytes=0&r=${Math.random()}`, { cache: 'no-store' });
      await res.arrayBuffer();
      const ms = performance.now() - t0;
      if (i === 0) continue;   // first request includes connection setup
      times.push(ms);
      drawPingSpark(times);
      setLive(Math.round(ms), 'ms', i / PING_COUNT);
    }
    const sorted = [...times].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    let jitter = 0;
    for (let i = 1; i < times.length; i++) jitter += Math.abs(times[i] - times[i - 1]);
    jitter /= times.length - 1;
    return { ping: median, jitter };
  }

  // ---- Throughput: several streams in parallel for a fixed time; bytes counted live.
  async function measureThroughput(kind, onUpdate, offsetMs = 0) {
    const seconds = kind === 'down' ? DOWN_SECONDS : UP_SECONDS;
    const cap = kind === 'down' ? DOWN_CAP : UP_CAP;
    let bytes = 0;
    const controller = new AbortController();
    const start = performance.now();
    let warmBytes = 0, warmTime = null;
    let sampleBytes = 0, sampleTime = 0;

    const done = () => performance.now() - start > seconds * 1000 || bytes >= cap;
    const tick = setInterval(() => {
      const t = performance.now() - start;
      if (warmTime === null && t > WARMUP_MS) { warmTime = t; warmBytes = bytes; }
      const dt = t - sampleTime;
      if (dt > 0) {
        addSample(kind, offsetMs + t, t, (bytes - sampleBytes) * 8 / dt / 1000);
        sampleBytes = bytes; sampleTime = t;
      }
      onUpdate(currentMbps(), t / (seconds * 1000));
      if (done()) controller.abort();
    }, 200);

    function currentMbps() {
      const t = performance.now() - start;
      if (warmTime === null) return t > 0 ? bytes * 8 / t / 1000 : 0;
      return (bytes - warmBytes) * 8 / (t - warmTime) / 1000;
    }

    const payload = kind === 'up' ? randomBytes(UP_CHUNK) : null;

    async function downloadStream() {
      while (!done()) {
        const res = await fetch(`${BASE}/__down?bytes=${DOWN_CHUNK}&r=${Math.random()}`, { cache: 'no-store', signal: controller.signal });
        const reader = res.body.getReader();
        for (;;) {
          const { done: end, value } = await reader.read();
          if (end) break;
          bytes += value.length;
        }
      }
    }
    function uploadOnce() {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        let sent = 0;
        xhr.open('POST', `${BASE}/__up?r=${Math.random()}`);
        xhr.upload.onprogress = e => { bytes += e.loaded - sent; sent = e.loaded; };
        xhr.onload = () => { bytes += UP_CHUNK - sent; resolve(); };
        xhr.onerror = () => reject(new Error('upload failed'));
        xhr.onabort = () => resolve();
        controller.signal.addEventListener('abort', () => xhr.abort());
        xhr.send(payload);
      });
    }
    async function uploadStream() {
      while (!done()) await uploadOnce();
    }

    const worker = kind === 'down' ? downloadStream : uploadStream;
    try {
      await Promise.all(Array.from({ length: STREAMS }, () => worker().catch(err => {
        if (err.name !== 'AbortError') throw err;
      })));
    } finally {
      clearInterval(tick);
      controller.abort();
    }
    return { mbps: currentMbps(), bytes, durationMs: performance.now() - start };
  }

  function randomBytes(n) {
    const buf = new Uint8Array(n);
    for (let i = 0; i < n; i += 65536) crypto.getRandomValues(buf.subarray(i, Math.min(n, i + 65536)));
    return buf;
  }

  // ---- Graph: every tick above records an instantaneous-throughput sample.
  // The average/peak stats are computed from these samples (post-warmup),
  // not from the single final reading, and the same samples draw the chart.
  let timeline = [];
  let chartScale = null;
  const GRAPH_W = 500, GRAPH_H = 110, GRAPH_PAD_L = 4, GRAPH_PAD_T = 18, GRAPH_PAD_B = 14;

  function addSample(kind, tAbs, tLocal, mbps) {
    timeline.push({ kind, t: tAbs, tLocal, mbps: Math.max(0, mbps) });
    drawChart();
  }

  function phaseAverage(kind) {
    const s = timeline.filter(d => d.kind === kind && d.tLocal > WARMUP_MS);
    if (!s.length) return null;
    return s.reduce((a, d) => a + d.mbps, 0) / s.length;
  }
  function phasePeak(kind) {
    const s = timeline.filter(d => d.kind === kind);
    return s.length ? Math.max(...s.map(d => d.mbps)) : null;
  }

  function drawChart() {
    const innerW = GRAPH_W - GRAPH_PAD_L * 2, innerH = GRAPH_H - GRAPH_PAD_T - GRAPH_PAD_B;
    const maxT = Math.max((DOWN_SECONDS + UP_SECONDS) * 1000, ...timeline.map(d => d.t));
    const maxV = Math.max(10, ...timeline.map(d => d.mbps)) * 1.15;
    const x = t => GRAPH_PAD_L + (t / maxT) * innerW;
    const y = v => GRAPH_PAD_T + innerH - (v / maxV) * innerH;
    chartScale = { x, y, maxT, maxV };

    function render(kind, lineId, areaId, dotId, labelId) {
      const pts = timeline.filter(d => d.kind === kind);
      if (!pts.length) {
        $(lineId).setAttribute('d', ''); $(areaId).setAttribute('d', '');
        $(dotId).style.opacity = 0; $(labelId).style.opacity = 0;
        return;
      }
      const line = pts.map((d, i) => `${i === 0 ? 'M' : 'L'}${x(d.t).toFixed(1)},${y(d.mbps).toFixed(1)}`).join(' ');
      const base = y(0);
      $(lineId).setAttribute('d', line);
      $(areaId).setAttribute('d', `${line} L${x(pts[pts.length - 1].t).toFixed(1)},${base} L${x(pts[0].t).toFixed(1)},${base} Z`);
      const last = pts[pts.length - 1];
      const cx = x(last.t), cy = y(last.mbps);
      $(dotId).setAttribute('cx', cx); $(dotId).setAttribute('cy', cy); $(dotId).style.opacity = 1;
      $(labelId).setAttribute('x', Math.min(GRAPH_W - 4, cx + 6));
      $(labelId).setAttribute('y', Math.max(10, cy - 6));
      $(labelId).setAttribute('text-anchor', cx > GRAPH_W - 50 ? 'end' : 'start');
      $(labelId).textContent = fmt(last.mbps);
      $(labelId).style.opacity = 1;
    }
    render('down', 'line-down', 'area-down', 'end-down', 'end-down-label');
    render('up', 'line-up', 'area-up', 'end-up', 'end-up-label');

    const gridV = maxV / 1.15;
    $('grid-max-line').setAttribute('y1', y(gridV)); $('grid-max-line').setAttribute('y2', y(gridV));
    $('grid-max-label').setAttribute('y', y(gridV) - 4);
    $('grid-max-label').textContent = timeline.length ? `${Math.round(gridV)} Mbit/s` : '';
  }

  function onGraphMove(evt) {
    if (!timeline.length || !chartScale) return;
    const rect = $('graph-svg').getBoundingClientRect();
    const px = (evt.clientX - rect.left) / rect.width * GRAPH_W;
    const t = Math.max(0, Math.min(chartScale.maxT, (px - GRAPH_PAD_L) / (GRAPH_W - GRAPH_PAD_L * 2) * chartScale.maxT));
    let nearest = timeline[0], bestDist = Infinity;
    for (const d of timeline) {
      const dist = Math.abs(d.t - t);
      if (dist < bestDist) { bestDist = dist; nearest = d; }
    }
    const cx = chartScale.x(nearest.t), cy = chartScale.y(nearest.mbps);
    $('hover-line').setAttribute('x1', cx); $('hover-line').setAttribute('x2', cx);
    $('hover-line').style.opacity = 1;
    $('hover-dot').setAttribute('cx', cx); $('hover-dot').setAttribute('cy', cy);
    $('hover-dot').setAttribute('fill', nearest.kind === 'down' ? 'var(--accent)' : 'var(--series-up)');
    $('hover-dot').style.opacity = 1;
    $('hover-label').setAttribute('x', Math.min(GRAPH_W - 4, Math.max(4, cx)));
    $('hover-label').setAttribute('text-anchor', cx > GRAPH_W - 100 ? 'end' : (cx < 100 ? 'start' : 'middle'));
    $('hover-label').textContent = `${nearest.kind === 'down' ? 'Download' : 'Upload'} · ${fmt(nearest.mbps)} Mbit/s · ${(nearest.tLocal / 1000).toFixed(1)}s`;
    $('hover-label').style.opacity = 1;
  }
  function onGraphLeave() {
    $('hover-line').style.opacity = 0;
    $('hover-dot').style.opacity = 0;
    $('hover-label').style.opacity = 0;
  }
  $('graph-svg').addEventListener('pointermove', onGraphMove);
  $('graph-svg').addEventListener('pointerleave', onGraphLeave);

  // ---- History (this device only)
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem('speedtest.history')) || []; } catch { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem('speedtest.history', JSON.stringify(list.slice(0, 10))); } catch {}
  }
  function renderHistory() {
    const list = loadHistory();
    $('history').hidden = list.length === 0;
    $('history-list').innerHTML = list.map(r => {
      const d = new Date(r.t);
      const when = d.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
      return `<li><span>${when}</span><span>↓ <b>${fmt(r.down)}</b></span><span>↑ <b>${fmt(r.up)}</b></span><span>${Math.round(r.ping)} ms</span></li>`;
    }).join('');
  }

  async function run() {
    if (!navigator.onLine) {
      $('message').textContent = 'You are offline. Connect to the internet to run a test.';
      $('message').className = 'message error';
      return;
    }
    $('start').disabled = true;
    $('message').textContent = '';
    $('message').className = 'message';
    for (const id of ['ping', 'down', 'up']) $(id).textContent = '–';
    $('jitter').textContent = '';
    $('down-sub').textContent = 'Mbit/s';
    $('up-sub').textContent = 'Mbit/s';
    timeline = [];
    $('graph-card').hidden = false;
    drawChart();
    drawPingSpark([]);

    try {
      setPhase('Ping', 'card-ping');
      const { ping, jitter } = await measurePing();
      $('ping').innerHTML = `${Math.round(ping)}<small>ms</small>`;
      $('jitter').textContent = `Jitter ${Math.round(jitter)} ms`;

      setPhase('Download', 'card-down');
      const down = await measureThroughput('down', (mbps, p) => setLive(fmt(mbps), 'Mbit/s', p));
      const downAvg = phaseAverage('down') ?? down.mbps;
      const downPeak = phasePeak('down');
      $('down').textContent = fmt(downAvg);
      if (downPeak != null) $('down-sub').textContent = `peak ${fmt(downPeak)} Mbit/s`;

      setPhase('Upload', 'card-up');
      const up = await measureThroughput('up', (mbps, p) => setLive(fmt(mbps), 'Mbit/s', p), down.durationMs);
      const upAvg = phaseAverage('up') ?? up.mbps;
      const upPeak = phasePeak('up');
      $('up').textContent = fmt(upAvg);
      if (upPeak != null) $('up-sub').textContent = `peak ${fmt(upPeak)} Mbit/s`;

      setPhase('Done', null);
      setLive(fmt(downAvg), 'Mbit/s download', 1);
      const usedMb = Math.round((down.bytes + up.bytes) / 1e6);
      $('message').textContent = `Data used: about ${usedMb} MB`;

      saveHistory([{ t: Date.now(), ping, down: downAvg, up: upAvg }, ...loadHistory()]);
      renderHistory();
    } catch (err) {
      setPhase('Stopped', null);
      $('message').textContent = 'The test could not reach the speed test server. Check your connection and try again.';
      $('message').className = 'message error';
    } finally {
      $('start').disabled = false;
      $('start').textContent = 'Run again';
    }
  }

  $('start').addEventListener('click', run);
  renderHistory();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
  }
</script>
</body>
</html>
