<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuel Murbach</title>
<meta name="description" content="Projekte und Links von Manuel Murbach">
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1c1a;
    --muted: #6b6b66;
    --card-bg: #ffffff;
    --card-border: #e5e4e0;
    --accent: #2b6a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --fg: #f0f0ec;
      --muted: #9b9b94;
      --card-bg: #201f1d;
      --card-border: #34332f;
      --accent: #6fcf9e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4rem 1.25rem 3rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }
  h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 2.5rem 0 0.9rem;
    font-weight: 600;
  }
  h2:first-of-type { margin-top: 0; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  a.card {
    display: block;
    padding: 1rem 1.15rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .card-title {
    font-weight: 600;
    font-size: 1rem;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .card-title::after {
    content: "→";
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  a.card:hover .card-title::after {
    opacity: 1;
  }
  .card-desc {
    margin-top: 0.25rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  footer {
    margin-top: 3.5rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a {
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Manuel Murbach</h1>
    <p>Projekte und Links</p>
  </header>

  <h2>Projekte</h2>
  <ul>
    <li>
      <a class="card" href="https://manuelmurbach.github.io/visible-from/">
        <div class="card-title">visible-from</div>
        <div class="card-desc">Berechnet die Sichtbarkeit von Bergspitzen und der Sonne von jedem beliebigen Standort basierend auf Geländedaten.</div>
      </a>
    </li>
  </ul>

  <h2>Links</h2>
  <ul>
    <li>
      <a class="card" href="https://map.geo.admin.ch/index.html#/map?lang=de&center=2663250.8,1204749.94&z=2&topic=ech&layers=ch.bazl.luftfahrtkarten-icao,f;ch.swisstopo-karto.skitouren,f;ch.swisstopo.swissimage-product@year=current,f;ch.swisstopo.swisstlm3d-wanderwege,f,1;ch.swisstopo.hangneigung-ueber_30,f,0.75;ch.bafu.wrz-wildruhezonen_portal;ch.bafu.wrz-jagdbanngebiete_select;ch.bafu.schutzgebiete-aulav_auen;ch.bafu.bundesinventare-hochmoore;ch.bafu.bundesinventare-flachmoore;ch.bafu.alpweiden-herdenschutzhunde;ch.pronatura.naturschutzgebiete&bgLayer=ch.swisstopo.pixelkarte-farbe&catalogNodes=457,532,687,458,477,485,491,508,510,517,527,599,614">
        <div class="card-title">SwissMap – Schutzgebiete</div>
        <div class="card-desc">SwissMap mit allen Schutzgebieten</div>
      </a>
    </li>
  </ul>

  <footer>
    <a href="mailto:manuel.murbach@gmail.com">manuel.murbach@gmail.com</a>
  </footer>
</main>
</body>
</html>
