<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speedometer</title>
<meta name="description" content="GPS speed and altitude, works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speedometer">
<meta name="theme-color" content="#100e17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%22 stop-color=%22%23ffb36b%22/><stop offset=%221%22 stop-color=%22%23f0603a%22/></linearGradient></defs><rect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22url(%23g)%22/><path d=%22M7 21a9 9 0 0 1 18 0%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/><path d=%22M16 21l5-6%22 stroke=%22white%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/></svg>">
<style>
  :root {
    --bg: #f6f3ee;
    --fg: #17151f;
    --muted: #6b6676;
    --tile-bg: rgba(255, 255, 255, 0.6);
    --tile-border: rgba(23, 21, 31, 0.08);
    --accent: #f0603a;
    --ok: #1f9d6f;
    --warn: #c98a12;
    --bad: #d6453a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100e17;
      --fg: #f3f1f8;
      --muted: #a49fb3;
      --tile-bg: rgba(255, 255, 255, 0.05);
      --tile-border: rgba(255, 255, 255, 0.09);
      --accent: #ff9d76;
      --ok: #4fd6a6;
      --warn: #f2c14e;
      --bad: #ff7b6e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: max(env(safe-area-inset-top), 1rem) 1rem max(env(safe-area-inset-bottom), 1rem);
    user-select: none;
    -webkit-user-select: none;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
  }
  .back {
    color: var(--muted);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.4rem 0;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
  .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: 0.3; } }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1.5rem;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
  }
  .speed { text-align: center; }
  .speed-value {
    font-size: clamp(6rem, 34vw, 11rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .unit-btn {
    margin-top: 0.4rem;
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 999px;
    padding: 0.35rem 1rem;
    cursor: pointer;
  }
  .unit-hint { margin-top: 0.4rem; font-size: 0.72rem; color: var(--muted); }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
  .stat {
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 16px;
    padding: 0.8rem 1rem;
  }
  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .stat-value {
    margin-top: 0.15rem;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat-value small { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-left: 0.2rem; }
  .stat.wide { grid-column: span 2; }

  .reset {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: 1px solid var(--tile-border);
    border-radius: 12px;
    padding: 0.7rem;
    cursor: pointer;
  }
  .message {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="/">← Apps</a>
    <span class="status"><span class="dot warn" id="dot"></span><span id="status-text">Waiting for GPS…</span></span>
  </div>

  <main>
    <div class="speed">
      <div class="speed-value" id="speed">–</div>
      <button class="unit-btn" id="unit-btn" type="button">km/h</button>
      <div class="unit-hint">Tap the unit to switch between km/h + m and kn + ft</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Altitude</div>
        <div class="stat-value" id="alt">–</div>
      </div>
      <div class="stat">
        <div class="stat-label">Heading</div>
        <div class="stat-value" id="heading">–</div>
      </div>
      <div class="stat">
        <div class="stat-label">Max speed</div>
        <div class="stat-value" id="max-speed">–</div>
      </div>
      <div class="stat">
        <div class="stat-label">Max altitude</div>
        <div class="stat-value" id="max-alt">–</div>
      </div>
      <div class="stat wide">
        <div class="stat-label">GPS accuracy</div>
        <div class="stat-value" id="accuracy">–</div>
      </div>
    </div>

    <button class="reset" id="reset" type="button">Reset max values</button>
    <div class="message" id="message"></div>
  </main>

<script>
  const UNITS = {
    metric:   { speed: 'km/h', factor: 3.6,      alt: 'm',  altFactor: 1 },
    aviation: { speed: 'kn',   factor: 1.943844, alt: 'ft', altFactor: 3.28084 },
  };
  const $ = id => document.getElementById(id);

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  let unitKey = load('speedo.unit', 'metric');
  if (!UNITS[unitKey]) unitKey = 'metric';
  let maxSpeed = load('speedo.maxSpeed', null);   // m/s
  let maxAlt = load('speedo.maxAlt', null);       // m
  let last = null;                                // { speed, alt, heading, accuracy }
  let prevFix = null;                             // for computing speed when the device reports none

  // Demo mode (?demo) fills in typical cruise values, used for the landing page preview.
  const demo = new URLSearchParams(location.search).has('demo');

  function fmtSpeed(ms) {
    if (ms == null) return '–';
    return Math.round(ms * UNITS[unitKey].factor).toString();
  }
  function fmtAlt(m) {
    if (m == null) return '–';
    const u = UNITS[unitKey];
    return `${Math.round(m * u.altFactor).toLocaleString('de-CH')}<small>${u.alt}</small>`;
  }
  function fmtHeading(deg) {
    if (deg == null || Number.isNaN(deg)) return '–';
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    return `${Math.round(deg)}°<small>${dirs[Math.round(deg / 45) % 8]}</small>`;
  }

  function render() {
    const u = UNITS[unitKey];
    $('unit-btn').textContent = u.speed;
    $('speed').textContent = fmtSpeed(last?.speed);
    $('alt').innerHTML = fmtAlt(last?.alt);
    $('heading').innerHTML = fmtHeading(last?.heading);
    $('max-speed').innerHTML = maxSpeed == null ? '–' : `${fmtSpeed(maxSpeed)}<small>${u.speed}</small>`;
    $('max-alt').innerHTML = fmtAlt(maxAlt);
    $('accuracy').innerHTML = last?.accuracy == null ? '–'
      : `±${Math.round(last.accuracy)}<small>m position</small>`
        + (last.altAccuracy != null ? ` ±${Math.round(last.altAccuracy)}<small>m altitude</small>` : '');
  }

  function setStatus(kind, text) {
    $('dot').className = 'dot ' + kind;
    $('status-text').textContent = text;
  }

  // Great-circle distance in metres.
  function distance(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function onPosition(pos) {
    const c = pos.coords;
    const fix = { lat: c.latitude, lon: c.longitude, t: pos.timestamp, accuracy: c.accuracy };

    let speed = c.speed != null && c.speed >= 0 ? c.speed : null;
    if (speed == null && prevFix && fix.accuracy < 50 && prevFix.accuracy < 50) {
      const dt = (fix.t - prevFix.t) / 1000;
      if (dt > 0.5) speed = distance(prevFix, fix) / dt;
    }
    prevFix = fix;

    last = {
      speed,
      alt: c.altitude,
      heading: speed != null && speed > 1 ? c.heading : null,
      accuracy: c.accuracy,
      altAccuracy: c.altitudeAccuracy,
    };

    if (speed != null && (maxSpeed == null || speed > maxSpeed)) { maxSpeed = speed; save('speedo.maxSpeed', maxSpeed); }
    if (c.altitude != null && (maxAlt == null || c.altitude > maxAlt)) { maxAlt = c.altitude; save('speedo.maxAlt', maxAlt); }

    if (c.accuracy <= 30) setStatus('ok', 'GPS fix');
    else setStatus('warn', `Weak signal (±${Math.round(c.accuracy)} m)`);
    $('message').textContent = c.altitude == null ? 'This device does not report altitude.' : '';
    render();
  }

  function onError(err) {
    if (err.code === err.PERMISSION_DENIED) {
      setStatus('bad', 'No permission');
      $('message').textContent = 'Allow location access for this site in your settings, then reload.';
    } else if (err.code === err.POSITION_UNAVAILABLE) {
      setStatus('bad', 'No GPS signal');
      $('message').textContent = 'In a plane, hold the phone close to the window.';
    } else {
      setStatus('warn', 'Waiting for GPS…');
    }
  }

  $('unit-btn').addEventListener('click', () => {
    unitKey = unitKey === 'metric' ? 'aviation' : 'metric';
    save('speedo.unit', unitKey);
    render();
  });
  $('reset').addEventListener('click', () => {
    maxSpeed = last?.speed ?? null;
    maxAlt = last?.alt ?? null;
    save('speedo.maxSpeed', maxSpeed);
    save('speedo.maxAlt', maxAlt);
    render();
  });

  // Keep the screen on while the speedometer is visible (where supported).
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } } catch {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  if (demo) {
    last = { speed: 243.5, alt: 11278, heading: 247, accuracy: 6, altAccuracy: 12 };
    maxSpeed = 251.1; maxAlt = 11582;
    setStatus('ok', 'GPS fix');
    render();
  } else if (!('geolocation' in navigator)) {
    setStatus('bad', 'No location support');
    render();
  } else {
    render();
    navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 30000,
    });
    keepAwake();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
  }
</script>
</body>
</html>
